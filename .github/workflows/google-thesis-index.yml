name: Monitor (Google Thesis Index)

on:
  workflow_dispatch: null
  push: null
  schedule:
    - cron: '0 */3 * * *'

jobs:
  check-index:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
    steps:
      - name: Check if thesis is indexed by Google
        id: check
        run: |
          QUERY=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("site:hal.science \"structural parameters, tight bounds, and parameterized approximation\""))')
          HTML=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Accept-Language: en-US,en;q=0.9" \
            "https://www.google.com/search?q=${QUERY}&num=10")
          echo "$HTML" > page.html

          # Indexed only when an actual result for the phrase appears in the SERP.
          # Google echoes the query (including the phrase) near the top, so a naive
          # grep matches even when nothing is indexed. We detect a real result by
          # looking for a result URL link AND the phrase, case-insensitively.
          if grep -oE 'https://[^"& ]*' page.html | grep -qi '/url?q=\|hal\.science' \
              && grep -qi 'structural parameters, tight bounds, and parameterized approximation' page.html; then
            echo "indexed=true" >> "$GITHUB_OUTPUT"
            echo "Thesis appears indexed."
          else
            echo "indexed=false" >> "$GITHUB_OUTPUT"
            echo "Thesis not indexed yet (or Google blocked the check)."
          fi

      - name: Notify Telegram when thesis is indexed
        if: steps.check.outputs.indexed == 'true'
        run: |
          BOT="${TELEGRAM_CHANNEL%%|*}"
          CHAT="${TELEGRAM_CHANNEL##*|}"
          curl -s -X POST "https://api.telegram.org/${BOT}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d text='✅ Your thesis is now indexed by Google! Query: site:hal.science "parallel algorithms for predicting rna structure"'
